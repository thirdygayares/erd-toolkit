name: "Deploy in FastAPI cloud"
permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Validate FastAPI Cloud secrets
        shell: bash
        run: |
          test -n "${FASTAPI_CLOUD_TOKEN}" || { echo "Missing FASTAPI_CLOUD_TOKEN"; exit 1; }
          test -n "${FASTAPI_CLOUD_APP_ID}" || { echo "Missing FASTAPI_CLOUD_APP_ID"; exit 1; }
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

      - name: Deploy to FastAPI Cloud
        working-directory: backend
        run: .venv/bin/fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
